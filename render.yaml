services:
  - type: web
    name: unq
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 18.20.4
      - key: PORT
        value: 10000
      - key: MAX_CONCURRENT
        value: "12"
      - key: ADMIN_USER
        value: a4ku
      - key: ADMIN_PASS
        value: "842001"
